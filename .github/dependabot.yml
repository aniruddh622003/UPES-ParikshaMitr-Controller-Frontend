version: 2
updates:
  - package-ecosystem:  npm
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ui-components:
         patterns:
          - "@mui/**"
          - "@fullcalendar/**"
          - "@ngx-lite/*" 
      data-management:
        patterns:
          - "@tanstack/react-query"
          - "axios"
          - "yup"
      utilities:
        patterns:
          - "date-fns"
          - "dayjs"
          - "notistack"
          - "next-qrcode"
      prod-deps-major:
        dependency-type: "production"
        update-types:
          - "major"
        patterns:
          -  "*"
      rest:
        patterns: 
          - "*"
        
